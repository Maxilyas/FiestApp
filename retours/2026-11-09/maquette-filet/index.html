<title>Le nouveau Filet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Une colonne de téléphone, comme la page du Cabinet : la manche se lit de haut en bas,
   l'époque puis la valeur puis le lancer. Les jetons sont ceux de FiestApp (Velours, et
   Ivoire en clair), les polices aussi : Cormorant pour ce qui se lit d'un coup d'œil,
   Figtree pour le reste. */
:root {
  --bg: #1a1412;
  --bg-halo: #2b211b;
  --bg-raised: #241c18;
  --ink: #f3ece2;
  --muted: #a89b8a;
  --accent: #d9b56a;
  --accent-text: #d9b56a;
  --accent-hover: #e8cb8a;
  --on-accent: #1a1412;
  --alert: #e06c6c;
  --ok: #8fcf9f;
  --surface: rgba(255, 255, 255, 0.035);
  --surface-strong: rgba(255, 255, 255, 0.07);
  --track: rgba(255, 255, 255, 0.12);
  --edge: rgba(217, 181, 106, 0.22);
  --edge-strong: rgba(217, 181, 106, 0.55);
  --accent-soft: rgba(217, 181, 106, 0.13);
  --anneau-3: rgba(217, 181, 106, 0.62);
  --anneau-2: rgba(217, 181, 106, 0.24);
  --retiree: 0.3;
  --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans: Figtree, 'Segoe UI', system-ui, sans-serif;
  --radius: 16px;
  --radius-sm: 12px;
  color-scheme: dark;
  accent-color: var(--accent);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f9f5ec; --bg-halo: #fffdf8; --bg-raised: #fffdf8;
    --ink: #2a201b; --muted: #74655a; --accent: #ac8536; --accent-text: #7d5f1e; --accent-hover: #c0973f;
    --on-accent: #1a1412; --alert: #b0392f; --ok: #2c7347;
    --surface: rgba(42, 32, 27, 0.04); --surface-strong: rgba(42, 32, 27, 0.08); --track: rgba(42, 32, 27, 0.16);
    --edge: rgba(172, 133, 54, 0.32); --edge-strong: rgba(150, 113, 40, 0.7); --accent-soft: rgba(172, 133, 54, 0.15);
    --anneau-3: rgba(172, 133, 54, 0.62); --anneau-2: rgba(172, 133, 54, 0.24);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f9f5ec; --bg-halo: #fffdf8; --bg-raised: #fffdf8;
  --ink: #2a201b; --muted: #74655a; --accent: #ac8536; --accent-text: #7d5f1e; --accent-hover: #c0973f;
  --on-accent: #1a1412; --alert: #b0392f; --ok: #2c7347;
  --surface: rgba(42, 32, 27, 0.04); --surface-strong: rgba(42, 32, 27, 0.08); --track: rgba(42, 32, 27, 0.16);
  --edge: rgba(172, 133, 54, 0.32); --edge-strong: rgba(150, 113, 40, 0.7); --accent-soft: rgba(172, 133, 54, 0.15);
  --anneau-3: rgba(172, 133, 54, 0.62); --anneau-2: rgba(172, 133, 54, 0.24);
  color-scheme: light;
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: radial-gradient(120% 60% at 50% 0%, var(--bg-halo), var(--bg) 70%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
#app {
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 40px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:where(button, input, summary, a):focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── Les pièces communes ─────────────────────────────────────────────── */
.label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 10px 18px;
  border: 1.5px solid var(--edge-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer;
  touch-action: manipulation; text-align: center;
}
.btn:hover { background: var(--surface-strong); }
.btn-or { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn-or:hover { background: var(--accent-hover); }
.btn-plein { width: 100%; min-height: 54px; font-size: 1.0625rem; }
.btn[aria-disabled="true"] { opacity: 0.45; cursor: default; }
.lien { background: none; border: 0; padding: 6px 0; color: var(--accent-text); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: left; }
.etoiles { font-family: var(--sans); letter-spacing: 0.08em; color: var(--accent-text); white-space: nowrap; }
.etoiles .vide { color: var(--muted); opacity: 0.55; }
.balise { width: 0.95em; height: 0.95em; vertical-align: -0.12em; stroke: #ffffff; stroke-width: 1.2; stroke-linejoin: round; flex: none; }
.balise-verte { fill: #1e9a53; } .balise-bleue { fill: #1c6dd4; } .balise-rouge { fill: #d63b3b; } .balise-noire { fill: #151515; }

/* ── L'accueil ───────────────────────────────────────────────────────── */
.accueil-tete { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
.accueil-tete h1 { font-family: var(--serif); font-size: 2.6rem; font-weight: 700; line-height: 1; letter-spacing: -0.01em; }
.chapo { color: var(--muted); max-width: 62ch; }
.promesses { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
.promesses li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.promesses .n { font-family: var(--serif); font-size: 1.5rem; font-weight: 700; line-height: 1; color: var(--accent-text); font-variant-numeric: lining-nums; text-align: center; }
.promesses b { font-weight: 700; }
.bloc { display: flex; flex-direction: column; gap: 10px; }
.actes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.acte-btn {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 64px; padding: 10px 12px;
  border: 1.5px solid var(--edge); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; text-align: left;
}
.acte-btn[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--accent-soft); }
.acte-btn b { font-family: var(--serif); font-size: 1.35rem; line-height: 1.1; }
.acte-btn small { color: var(--muted); font-size: 0.8125rem; display: flex; gap: 6px; align-items: center; }
.modes { display: grid; gap: 10px; }
.mode-btn { flex-direction: column; gap: 2px; min-height: 64px; }
.mode-btn small { font-weight: 500; opacity: 0.85; font-size: 0.875rem; }
.reglages { display: grid; gap: 8px; padding: 12px 14px; border: 1px solid var(--edge); border-radius: var(--radius-sm); background: var(--surface); }
.bascule { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; cursor: pointer; }
.bascule span small { display: block; color: var(--muted); font-size: 0.8125rem; }
.bascule input { width: 22px; height: 22px; flex: none; }
.liens { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.pied { color: var(--muted); font-size: 0.8125rem; }

/* ── La tête d'une manche ────────────────────────────────────────────── */
.tete { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tete-g { display: flex; flex-direction: column; }
.tete-g b { font-family: var(--serif); font-size: 1.2rem; line-height: 1.1; }
.tete-g span { color: var(--muted); font-size: 0.8125rem; }
.tete-d { display: flex; align-items: center; gap: 12px; }
.coeurs { color: var(--alert); letter-spacing: 0.06em; font-size: 1.05rem; white-space: nowrap; }
.coeurs .perdu { color: var(--muted); opacity: 0.4; }
.quitter { background: none; border: 0; color: var(--muted); font-weight: 600; cursor: pointer; padding: 8px 0; }
.chrono { height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; }
.chrono span { display: block; height: 100%; background: var(--accent); transform-origin: left center; }
.chrono.presse span { background: var(--alert); }
.question-bloc { display: flex; flex-direction: column; gap: 6px; }
.ligne-du-mode { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ligne-du-mode span:last-child { color: var(--accent-text); }
.question { font-family: var(--serif); font-size: 1.5rem; font-weight: 700; line-height: 1.18; }
.question.longue { font-size: 1.3rem; }

/* ── Le nouveau Filet : l'époque, puis la valeur ─────────────────────── */
.etape { display: flex; flex-direction: column; gap: 8px; }
.etape-titre { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.etape-titre b { font-weight: 700; }
.etape-titre .num { display: inline-grid; place-items: center; width: 22px; height: 22px; margin-right: 8px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); font-size: 0.8125rem; font-weight: 700; }
.etape-titre .regle { color: var(--muted); font-size: 0.8125rem; }
.frise { position: relative; padding-top: 18px; }
.frise.sans-reperes { padding-top: 0; }
.tranches { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1.5px solid var(--edge-strong); border-radius: var(--radius-sm); overflow: hidden; }
.tranche {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  min-height: 58px; padding: 6px 2px; border: 0; border-left: 1px solid var(--edge); background: var(--surface);
  cursor: pointer; font-variant-numeric: lining-nums tabular-nums; line-height: 1.15; touch-action: manipulation;
}
.tranche:first-child { border-left: 0; }
.tranche .de { font-weight: 700; font-size: 0.95rem; }
.tranche .a { color: var(--muted); font-size: 0.8125rem; }
.tranche.une-ligne .de { font-size: 1rem; }
.tranche[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.tranche[aria-pressed="true"] .a { color: var(--on-accent); opacity: 0.8; }
.tranche.retiree { opacity: var(--retiree); cursor: default; text-decoration: line-through; }
.tranche.bonne { background: color-mix(in srgb, var(--ok) 26%, transparent); }
.tranche.bonne.choisie { background: var(--ok); color: var(--bg); }
.tranche.choisie:not(.bonne) { box-shadow: inset 0 0 0 2px var(--alert); }
.marques { position: absolute; left: 0; right: 0; top: 0; height: 18px; pointer-events: none; }
.marque { position: absolute; top: 2px; width: 2px; height: 22px; margin-left: -1px; background: var(--muted); border-radius: 1px; }
.marque::before { content: ''; position: absolute; top: -3px; left: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.marque.perso, .marque.perso::before { background: var(--accent); }
/* La réponse et le lancer, à la révélation : des épingles au-dessus de la frise, jamais en travers de ses libellés. */
.marque.reponse { width: 3px; margin-left: -1.5px; background: var(--ink); z-index: 2; }
.marque.reponse::before { top: -5px; left: -5.5px; width: 14px; height: 14px; background: var(--ink); }
.marque.lancer { width: 0; border-left: 2px dashed var(--accent-text); background: none; z-index: 1; }
.marque.lancer::before { top: -1px; left: -5px; background: var(--accent-text); }
.frise.revelee { padding-top: 24px; }
.epingles { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0; padding: 0; list-style: none; font-size: 0.8125rem; color: var(--muted); }
.epingles li { display: inline-flex; align-items: center; gap: 6px; }
.epingles i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); }
.epingles .toi i { background: var(--accent-text); }
.legende { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0; padding: 0; list-style: none; color: var(--muted); font-size: 0.8125rem; }
.legende li { display: inline-flex; align-items: center; gap: 6px; }
.legende i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.legende .perso i { background: var(--accent); }
.legende .perso { color: var(--accent-text); }

.valeur-vise { display: flex; align-items: baseline; justify-content: center; gap: 8px; }
.valeur { font-family: var(--serif); font-size: 2.6rem; font-weight: 700; line-height: 1; color: var(--accent-text); font-variant-numeric: lining-nums tabular-nums; }
.valeur small { font-size: 1.3rem; }
.curseur { display: flex; align-items: center; gap: 8px; }
.cran { flex: none; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 1.5px solid var(--edge-strong); border-radius: 12px; background: var(--surface-strong); font-size: 1.5rem; font-weight: 700; line-height: 1; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.piste { position: relative; flex: 1; min-width: 0; }
.rail { position: relative; height: 44px; }
.rail::before { content: ''; position: absolute; left: 0; right: 0; top: 20px; height: 4px; border-radius: 2px; background: var(--track); }
.anneau { position: absolute; top: 8px; height: 28px; border-radius: 8px; pointer-events: none; }
.anneau-2 { background: var(--anneau-2); border: 1.5px solid var(--anneau-3); }
.anneau-3 { top: 13px; height: 18px; background: var(--anneau-3); }
.zone { position: absolute; top: 12px; height: 20px; border: 1.5px dashed var(--accent-text); border-radius: 9px; background: color-mix(in srgb, var(--accent) 22%, transparent); pointer-events: none; }
.vrai { position: absolute; top: 2px; width: 4px; height: 40px; margin-left: -2px; border-radius: 2px; background: var(--ink); }
.range { position: absolute; inset: 0; width: 100%; height: 44px; margin: 0; background: transparent; cursor: pointer; -webkit-appearance: none; appearance: none; }
.range::-webkit-slider-runnable-track { height: 44px; background: transparent; }
.range::-webkit-slider-thumb { box-sizing: border-box; width: 10px; height: 40px; margin-top: 2px; border: 2px solid var(--bg); border-radius: 5px; background: var(--accent); -webkit-appearance: none; appearance: none; }
.range::-moz-range-track { height: 44px; background: transparent; }
.range::-moz-range-thumb { box-sizing: border-box; width: 10px; height: 40px; border: 2px solid var(--bg); border-radius: 5px; background: var(--accent); }
.bornes { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.8125rem; font-variant-numeric: lining-nums tabular-nums; margin: 0 2px; }
/* Le curseur pas encore posé : ni poignée, ni valeur — la piste attend un toucher. */
.curseur.vierge .range::-webkit-slider-thumb { opacity: 0; }
.curseur.vierge .range::-moz-range-thumb { opacity: 0; }
.curseur.vierge .rail::before { height: 8px; top: 18px; border-radius: 4px; background: repeating-linear-gradient(90deg, var(--edge-strong) 0 6px, transparent 6px 12px); }
.a-poser { font-family: var(--sans); font-size: 1.0625rem; font-weight: 600; color: var(--muted); }
.attente { padding: 14px; border: 1.5px dashed var(--edge); border-radius: var(--radius-sm); color: var(--muted); text-align: center; }
.apparait { animation: apparait 220ms ease-out; }
@keyframes apparait { from { opacity: 0.35; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.aides { display: flex; flex-direction: column; gap: 8px; }
.aides-rangee { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.aide { display: flex; flex-direction: column; align-items: flex-start; gap: 0; min-height: 52px; padding: 8px 12px; border: 1.5px solid var(--edge); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; text-align: left; touch-action: manipulation; }
.aide b { font-weight: 600; font-size: 0.9375rem; line-height: 1.2; }
.aide small { color: var(--muted); font-size: 0.8125rem; }
.aide.offerte small { color: var(--accent-text); font-weight: 600; }
.aide[aria-disabled="true"] { opacity: 0.5; cursor: default; }
.plafond { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 0.875rem; }
.indice { padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.indice b { color: var(--accent-text); }

/* ── Le Filet d'aujourd'hui ──────────────────────────────────────────── */
.tailles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.taille { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; padding: 8px 4px; border: 1.5px solid var(--edge-strong); border-radius: var(--radius-sm); background: var(--surface); font-weight: 700; cursor: pointer; touch-action: manipulation; }
.taille[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-soft); }
.couvre { color: var(--muted); text-align: center; font-variant-numeric: lining-nums tabular-nums; }
.grands-pas { display: flex; justify-content: space-between; gap: 8px; }
.grands-pas .cran { width: auto; padding: 4px 14px; font-size: 0.95rem; }

/* ── La révélation et le bilan ───────────────────────────────────────── */
.verdict { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: var(--radius); border: 1.5px solid var(--edge-strong); background: var(--surface); }
.verdict.rate { border-color: color-mix(in srgb, var(--alert) 65%, transparent); }
.verdict .grand { font-family: var(--serif); font-size: 1.9rem; font-weight: 700; line-height: 1.05; }
.verdict .etoiles { font-size: 1.4rem; }
.reponse { font-family: var(--serif); font-size: 1.45rem; font-weight: 700; line-height: 1.2; font-variant-numeric: lining-nums tabular-nums; }
.detail-juge { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.detail-juge li { display: flex; justify-content: space-between; gap: 10px; }
.detail-juge .oui { color: var(--ok); font-weight: 700; }
.detail-juge .non { color: var(--muted); }
.anecdote { color: var(--ink); opacity: 0.9; }
.gagne { padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--edge-strong); background: var(--accent-soft); }
.recap { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.recap li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 12px; border: 1px solid var(--edge); border-radius: var(--radius-sm); background: var(--surface); }
.recap .q { grid-column: 1 / -1; font-weight: 600; }
.recap .r { color: var(--muted); font-size: 0.875rem; font-variant-numeric: lining-nums tabular-nums; }
.actions { display: grid; gap: 8px; }

/* ── Les coulisses : ce que le moteur sait de la question ─────────────── */
.coulisses { border: 1px dashed var(--edge-strong); border-radius: var(--radius-sm); padding: 10px 12px; background: var(--surface); }
.coulisses summary { cursor: pointer; font-weight: 600; color: var(--accent-text); }
.coulisses dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 10px 0 0; font-size: 0.875rem; }
.coulisses dt { color: var(--muted); }
.coulisses dd { margin: 0; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }

/* ── Les pages d'explication ─────────────────────────────────────────── */
.page h1 { font-family: var(--serif); font-size: 2.1rem; line-height: 1.05; font-variant-numeric: lining-nums; }
.page h2 { font-family: var(--serif); font-size: 1.45rem; line-height: 1.1; margin-top: 6px; font-variant-numeric: lining-nums; }
.question, .verdict .grand, .acte-btn b, .tete-g b { font-variant-numeric: lining-nums; }
.page p, .page li { max-width: 65ch; }
.page ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.tableau { overflow-x: auto; }
.tableau table { border-collapse: collapse; width: 100%; font-size: 0.875rem; font-variant-numeric: lining-nums tabular-nums; }
.tableau th, .tableau td { padding: 7px 8px; border-bottom: 1px solid var(--edge); text-align: right; vertical-align: top; }
.tableau th:first-child, .tableau td:first-child { text-align: left; }
.tableau thead th { color: var(--muted); font-weight: 600; font-size: 0.8125rem; }
.tableau tr.fort td { color: var(--accent-text); font-weight: 700; }
.retour { align-self: flex-start; }

/* Le graphique des règles : une barre (les manches réussies), un trait (ce que le hasard attrape), une échelle. */
.graphe { margin: 0; display: flex; flex-direction: column; gap: 10px; }
.graphe-legende { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 0.875rem; }
.graphe-legende span { display: inline-flex; align-items: center; gap: 6px; }
.cle-barre { display: inline-block; width: 18px; height: 10px; border-radius: 0 4px 4px 0; background: var(--accent); }
.cle-trait { display: inline-block; width: 3px; height: 16px; border-radius: 2px; background: var(--ink); }
.graphe-lignes { display: grid; gap: 12px; }
