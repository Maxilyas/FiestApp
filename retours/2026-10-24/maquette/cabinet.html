<title>Le Cabinet de curiosités</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Un musée la nuit : bois sombre, cadres dorés, cartels crème. Une colonne de téléphone, centrée sur grand écran. */
:root {
  --bg: #1a1412; --bois: #241c18; --bois-2: #2e241e; --cadre: #5a4630; --cadre-ombre: #3a2c1c;
  --fg: #f3ead9; --muet: #cbbda9; --or: #d9b56a; --or-clair: #e8cb8a; --or-voile: rgba(217,181,106,.13);
  --creme: #efe6d3; --encre: #2a201b; --encre-muette: #6f604f;
  --juste: #5b9bd5; --juste-voile: rgba(91,155,213,.16); --faux: #d0773a; --faux-voile: rgba(208,119,58,.16);
  --rare: #7fb7e8; --epique: #b98ae0; --maudit: #e07a7a; --commun: #a89b8a;
  --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans: Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 16px; line-height: 1.45; }
#app { max-width: 440px; margin: 0 auto; min-height: 100%; padding-block: 14px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--serif); margin: 0; line-height: 1.05; text-wrap: balance; }
h1 { font-size: 34px; } h2 { font-size: 24px; } h3 { font-size: 20px; }
p { margin: 0; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--or-clair); outline-offset: 2px; }
.muet { color: var(--muet); } .or { color: var(--or); } .petit { font-size: 15px; } .mini { font-size: 13px; }
.etiquette { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--or); font-weight: 700; }
.ligne { display: flex; align-items: center; gap: 10px; }
.entre { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pile { display: flex; flex-direction: column; gap: 10px; }
.grille2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.grille3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.retour { all: unset; cursor: pointer; color: var(--or); font-size: 14px; padding: 6px 0; }
.bouton { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 16px; border-radius: 14px; background: var(--or); color: #1a1412; font-weight: 700; font-size: 16px; text-align: center; }
@media (hover: hover) { .bouton:hover { background: var(--or-clair); } .bouton.second:hover { border-color: var(--or); } .choix:hover { border-color: rgba(217,181,106,.5); } .tuile:hover { border-color: rgba(217,181,106,.4); } }
.bouton.second { background: transparent; color: var(--fg); border: 2px solid rgba(255,255,255,.16); font-weight: 600; }
.bouton[disabled] { opacity: .4; cursor: default; }
.bloc { background: var(--bois); border-radius: 16px; padding: 14px; }
.cartel { background: var(--creme); color: var(--encre); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.cartel .etiquette { color: var(--encre-muette); }
.cartel p.phrase { font-family: var(--serif); font-size: 21px; font-weight: 600; line-height: 1.2; }
.etoiles { color: var(--or); letter-spacing: .06em; font-weight: 700; white-space: nowrap; }
.gemme { width: 9px; height: 9px; border-radius: 2px; transform: rotate(45deg); flex: none; display: inline-block; }
.g-commun { background: var(--commun); } .g-rare { background: var(--rare); } .g-epique { background: var(--epique); } .g-maudit { background: var(--maudit); } .g-legendaire { background: var(--or); }
.cadre { padding: 5px; border-radius: 4px; background: var(--cadre); box-shadow: inset 0 0 0 2px var(--cadre-ombre); }
.cadre img { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 2px; }
.cadre.dore { background: var(--or); box-shadow: inset 0 0 0 2px #a8853f, 0 0 16px rgba(217,181,106,.35); }
.vide { aspect-ratio: 4/3; border-radius: 4px; border: 2px dashed rgba(217,181,106,.35); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px; text-align: center; }
.vide .q { font-family: var(--serif); font-size: 28px; color: var(--or); line-height: 1; }
.oeuvre { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.oeuvre .nom { display: flex; align-items: center; gap: 6px; font-family: var(--serif); font-size: 17px; font-weight: 700; line-height: 1; }
.porte { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.porte .arche { height: 104px; border-radius: 80px 80px 10px 10px; overflow: hidden; border: 3px solid #6b5432; background: var(--bois-2); }
.porte .arche img { width: 100%; height: 100%; object-fit: cover; display: block; }
.porte .arche.complete { border-color: var(--or); }
.porte .n { font-family: var(--serif); font-size: 18px; font-weight: 700; line-height: 1; }
.jauge { height: 6px; border-radius: 3px; background: rgba(255,255,255,.09); overflow: hidden; }
.jauge > span { display: block; height: 100%; background: var(--or); border-radius: 3px; }
.tuile { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; background: var(--bois); border: 2px solid transparent; }
.tuile.active { border-color: var(--or); }
.tuile.faite { opacity: .62; }
.vignette { width: 84px; height: 63px; flex: none; padding: 3px; border-radius: 3px; background: var(--cadre); display: flex; align-items: center; justify-content: center; }
.vignette img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vignette .q { font-family: var(--serif); font-size: 28px; color: var(--or); }
.titre-tuile { font-family: var(--serif); font-size: 21px; font-weight: 700; line-height: 1.05; }
.puce { all: unset; cursor: pointer; padding: 8px 12px; border-radius: 99px; background: rgba(255,255,255,.07); font-size: 13px; }
.puce.active { background: var(--or); color: #1a1412; font-weight: 700; }
.medaillon { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2px solid var(--or); flex: none; }
.medaillon.endormi { filter: grayscale(1) brightness(.45); border-style: dashed; border-color: var(--muet); }
.choix { all: unset; box-sizing: border-box; cursor: pointer; min-height: 50px; padding: 10px 14px; border-radius: 12px; background: var(--bois); border: 2px solid rgba(255,255,255,.1); display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 600; }
.choix.juste { background: var(--juste-voile); border-color: var(--juste); }
.choix.faux { background: var(--faux-voile); border-color: var(--faux); }
.choix.efface { opacity: .25; pointer-events: none; text-decoration: line-through; }
.choix.pris { border-color: var(--or); }
.haut-jeu { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.points { display: flex; gap: 5px; }
.points span { width: 26px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); }
.points span.fait { background: var(--or); }
.chrono { height: 5px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
.chrono span { display: block; height: 100%; background: var(--muet); transition: width .25s linear; }
.chrono span.bientot { background: var(--faux); }
.carte-emportee { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 5px; border-radius: 12px; border: 2px solid rgba(217,181,106,.45); font-size: 12px; line-height: 1.2; }
.carte-emportee img { width: 46px; height: 34px; object-fit: cover; border-radius: 2px; }
.carte-emportee.use { opacity: .45; cursor: default; }
.carte-emportee.passive { cursor: default; border-style: dashed; }
.bandeau { padding: 10px 12px; border-radius: 12px; background: rgba(127,183,232,.12); border: 1px solid rgba(127,183,232,.4); font-size: 13px; }
.bandeau.or { background: var(--or-voile); border-color: rgba(217,181,106,.5); }
.verdict { font-family: var(--serif); font-size: 30px; font-weight: 700; line-height: 1; font-variant-numeric: lining-nums; }
.carte-france { width: 100%; height: auto; display: block; touch-action: manipulation; cursor: crosshair; }
.zone-carte { background: #16202a; border-radius: 18px; padding: 6px; position: relative; }
.mot-grille { display: flex; flex-direction: column; gap: 5px; align-items: center; }
.mot-ligne { display: flex; gap: 5px; }
.case { width: 38px; height: 38px; border-radius: 7px; border: 2px solid rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 700; }
.case.bien { background: var(--juste); border-color: var(--juste); color: #fff; }
.case.ailleurs { background: var(--faux); border-color: var(--faux); color: #fff; }
.case.absente { background: #3a302b; border-color: #3a302b; color: var(--muet); }
.case.courante { border-color: var(--fg); }
.case.soufflee { border-color: var(--juste); color: var(--juste); }
.clavier { display: flex; flex-direction: column; gap: 5px; }
.clavier .rang { display: flex; gap: 4px; justify-content: center; }
.touche { all: unset; cursor: pointer; flex: 1; max-width: 38px; min-width: 0; height: 50px; border-radius: 6px; background: #4a3e37; text-align: center; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
.touche.large { max-width: 70px; flex: 2; font-size: 12px; }
.touche.bien { background: var(--juste); } .touche.ailleurs { background: var(--faux); } .touche.absente { background: #221b18; color: #6f6458; text-decoration: line-through; }
.touche.valider { background: var(--or); color: #1a1412; }
.frise { position: relative; display: flex; flex-direction: column; gap: 4px; }
.frise::before { content: ""; position: absolute; left: 61px; top: 10px; bottom: 10px; width: 2px; background: rgba(217,181,106,.3); }
.evt { display: flex; align-items: center; gap: 10px; }
.evt .an { font-variant-numeric: lining-nums; width: 46px; flex: none; text-align: right; font-family: var(--serif); font-size: 19px; font-weight: 700; color: var(--or); }
.evt .pt { width: 12px; height: 12px; flex: none; border-radius: 50%; background: var(--or); border: 3px solid var(--bg); z-index: 1; }
.evt .lb { flex: 1; padding: 8px 12px; border-radius: 10px; background: var(--bois); font-size: 14px; line-height: 1.25; }
.evt.neuf .lb { background: var(--creme); color: var(--encre); font-weight: 600; }
.evt.juste .lb { box-shadow: inset 0 0 0 2px var(--juste); } .evt.juste .an { color: var(--juste); }
.evt.faux .lb { box-shadow: inset 0 0 0 2px var(--faux); } .evt.faux .an { color: var(--faux); }
.fente { all: unset; cursor: pointer; margin-left: 68px; height: 30px; border-radius: 8px; border: 2px dashed rgba(255,255,255,.12); font-size: 12px; color: var(--muet); display: flex; align-items: center; justify-content: center; }
.fente.vivante { border-color: var(--juste); background: rgba(91,155,213,.12); color: var(--fg); }
.a-placer { all: unset; box-sizing: border-box; cursor: pointer; padding: 11px 14px; border-radius: 12px; background: var(--creme); color: var(--encre); font-size: 14px; font-weight: 600; border: 3px solid transparent; }
.a-placer.pris { border-color: var(--juste); transform: rotate(-1.5deg); box-shadow: 0 10px 24px rgba(0,0,0,.45); }
.tableau { border-radius: 4px; overflow: hidden; background: var(--cadre); padding: 8px; }
.tableau img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
.filet-piste { position: relative; height: 64px; margin: 4px 6px 0; }
.filet-piste .rail { position: absolute; left: 0; right: 0; top: 24px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); }
.filet-piste .maille { position: absolute; top: 12px; height: 28px; border-radius: 8px; background: rgba(127,183,232,.22); border: 2px solid var(--rare); }
.filet-piste .chaud { position: absolute; top: 20px; height: 12px; border-radius: 6px; background: rgba(217,181,106,.3); }
.filet-piste .vrai { position: absolute; top: 4px; width: 4px; height: 44px; margin-left: -2px; background: var(--fg); border-radius: 2px; }
.filet-piste .bornes { position: absolute; left: 0; right: 0; top: 46px; display: flex; justify-content: space-between; font-size: 11px; color: var(--muet); }
input[type=range] { width: 100%; accent-color: var(--or); height: 32px; }
.affirmation { background: var(--creme); color: var(--encre); border-radius: 22px; padding: 22px 20px; min-height: 230px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
.affirmation .q { font-size: 15px; color: var(--encre-muette); }
.affirmation .r { font-family: var(--serif); font-size: 30px; font-weight: 700; line-height: 1.1; }
.indice { display: flex; gap: 10px; align-items: center; min-height: 50px; padding: 8px 12px; border-radius: 12px; background: var(--bois); }
.indice b { width: 26px; height: 26px; flex: none; border-radius: 50%; background: var(--or); color: #1a1412; display: flex; align-items: center; justify-content: center; font-size: 13px; }
.indice.cache { background: transparent; border: 2px dashed rgba(255,255,255,.12); color: var(--muet); }
.indice.cache b { background: rgba(255,255,255,.08); color: var(--muet); }
.champ { width: 100%; height: 52px; border-radius: 14px; border: 2px solid var(--or); background: var(--bois); color: var(--fg); font: 600 18px var(--sans); padding: 0 14px; }
.replique { background: var(--bois); border-radius: 20px; padding: 24px 20px; }
.replique p { font-family: var(--serif); font-style: italic; font-size: 30px; font-weight: 600; line-height: 1.2; }
.replique .trou { display: inline-block; min-width: 90px; border-bottom: 3px solid var(--or); color: var(--or); font-style: normal; }
.outils { margin-top: 18px; padding: 12px; border-radius: 12px; border: 1px dashed rgba(255,255,255,.18); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.outils .titre { width: 100%; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muet); }
.toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--creme); color: var(--encre); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: 90vw; z-index: 20; }
.apparait { animation: apparait .5s ease-out; }
@keyframes apparait { from { transform: translateY(10px) scale(.97); opacity: .3; } to { transform: none; opacity: 1; } }
.eveil { animation: eveil 1.4s ease-out; }
@keyframes eveil { from { filter: grayscale(1) brightness(.4); transform: scale(.85); } to { filter: none; transform: none; } }
/* La version 2 : en-tête et pied collants, pour qu'un petit téléphone garde le chrono et le bouton sous les yeux. */
.haut-collant { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px 6px; margin-block: -8px 0; display: flex; flex-direction: column; gap: 8px; }
.pied-collant { position: sticky; bottom: 0; z-index: 4; background: var(--bg); padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -12px 16px var(--bg); }
.question { font-family: var(--serif); font-size: 23px; font-weight: 700; line-height: 1.18; margin-top: 4px; }
.chiffre { font-family: var(--sans); font-size: 26px; font-weight: 700; color: var(--or); font-variant-numeric: tabular-nums; min-width: 28px; text-align: center; }
.pastille { width: 13px; height: 13px; border-radius: 3px; display: inline-block; } .pastille.bien { background: var(--juste); } .pastille.ailleurs { background: var(--faux); } .pastille.absente { background: #221b18; border: 1px solid #6f6458; }
.defile { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; align-items: flex-start; scroll-snap-type: x proximity; }
.defile > * { scroll-snap-align: start; }
.touche-fine { all: unset; cursor: pointer; flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--bois); border: 2px solid rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; }
.question.compacte { font-size: 20px; }
@media (prefers-reduced-motion: reduce) { .apparait, .eveil { animation: none; } .chrono span { transition: none; } }
</style>

<div id="app" aria-live="polite"></div>

<script src="donnees.js"></script>
<script src="contenu.js"></script>
<script src="jeu.js"></script>
