:root {
  --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans: Figtree, 'Segoe UI', system-ui, sans-serif;
  --emoji: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;

  /* Ivoire : Velours passé sur papier — le champagne s'assombrit pour rester
     lisible, le noir chaud devient l'encre. Économe en encre. */
  --paper: #f9f5ec;
  --paper-image: none;
  --card: #fffdf8;
  --ink: #2a201b;
  --muted: #8b7d6c;
  --accent: #ac8536;
  --filet: #d9b56a;
  --edge: rgba(172, 133, 54, 0.38);
  --edge-soft: rgba(172, 133, 54, 0.2);
}

/* Velours : la feuille telle qu'on voit l'application, fond noir chaud. */
html[data-theme="velours"] {
  --paper: #1a1412;
  --paper-image: radial-gradient(120% 60% at 50% -10%, #2b211b 0%, #1a1412 60%);
  --card: rgba(255, 255, 255, 0.035);
  --ink: #f3ece2;
  --muted: #a89b8a;
  --accent: #d9b56a;
  --filet: #d9b56a;
  --edge: rgba(217, 181, 106, 0.26);
  --edge-soft: rgba(217, 181, 106, 0.16);
}

* { box-sizing: border-box; margin: 0; }

html, body {
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}

body {
  background: #0f0d0c;
  padding: 76px 16px 56px;
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}

/* ── La feuille A4 ─────────────────────────────────────────────────── */
.sheet {
  width: 210mm;
  height: 297mm;
  margin: 0 auto;
  padding: 11mm 12mm 9mm;
  background-color: var(--paper);
  background-image: var(--paper-image);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
  outline: 1px solid rgba(255, 255, 255, 0.06);
}

.head { text-align: center; padding-bottom: 4.5mm; }

.eyebrow {
  font-size: 8pt;
  font-weight: 500;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--muted);
}

.title {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 54pt;
  line-height: 1;
  letter-spacing: 0.02em;
  color: var(--accent);
  margin-top: 1.5mm;
}

.subtitle {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 500;
  font-size: 15pt;
  color: var(--muted);
  margin-top: 2mm;
}

.filet {
  height: 1px;
  background: linear-gradient(90deg, rgba(217, 181, 106, 0) 0%, var(--filet) 50%, rgba(217, 181, 106, 0) 100%);
}

/* ── Les six cartes ────────────────────────────────────────────────── */
.grid {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: repeat(3, minmax(0, 1fr));
  gap: 4.5mm;
  margin: 5mm 0 4mm;
}

.card {
  min-height: 0;
  padding: 4.5mm 5.5mm 4mm;
  background: var(--card);
  border: 1px solid var(--edge);
  border-radius: 4mm;
  display: flex;
  flex-direction: column;
}

.card-head {
  display: flex;
  align-items: center;
  gap: 3.5mm;
  padding-bottom: 2.5mm;
  margin-bottom: 2.5mm;
  border-bottom: 1px solid var(--edge-soft);
}

.num {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 30pt;
  line-height: 1;
  font-variant-numeric: lining-nums;
  color: var(--accent);
  min-width: 8mm;
  text-align: center;
}

.card-title {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 17pt;
  line-height: 1.05;
}

.card-title .emoji {
  font-family: var(--emoji);
  font-size: 12pt;
  margin-left: 1.5mm;
  vertical-align: 0.08em;
}

.card-meta {
  font-size: 7.5pt;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 1.3mm;
}

.members {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.5mm;
}

.member {
  display: flex;
  align-items: baseline;
  gap: 1.8mm;
  font-size: 12pt;
  line-height: 1.3;
}

.member .name { font-weight: 500; }
.member .plus { color: var(--muted); font-size: 10.5pt; }

.star {
  width: 9pt;
  height: 9pt;
  flex: none;
  color: var(--accent);
  align-self: center;
}

.member .group {
  margin-left: auto;
  padding-left: 3mm;
  font-size: 7pt;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}

html[data-groupes="non"] .member .group { display: none; }

.foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 2.5mm;
  border-top: 1px solid var(--edge-soft);
  font-size: 7.5pt;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
}

.foot .legend { display: inline-flex; align-items: center; gap: 1.5mm; }
.foot .star { width: 8pt; height: 8pt; }

/* ── La barre d'outils, à l'écran seulement ────────────────────────── */
.toolbar {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 10;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 20px;
  background: #1a1412;
  border-bottom: 1px solid rgba(217, 181, 106, 0.22);
  color: #f3ece2;
  font-size: 13px;
}

.tb-title {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 19px;
  color: #d9b56a;
  margin-right: auto;
  white-space: nowrap;
}

.seg {
  display: inline-flex;
  border: 1px solid rgba(217, 181, 106, 0.4);
  border-radius: 999px;
  overflow: hidden;
}

.seg button {
  background: transparent;
  border: 0;
  color: #a89b8a;
  padding: 7px 16px;
  font: inherit;
  cursor: pointer;
}

.seg button[aria-pressed="true"] { background: #d9b56a; color: #1a1412; font-weight: 600; }

.toolbar label {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: #a89b8a;
  cursor: pointer;
  white-space: nowrap;
}

.toolbar input[type="checkbox"] { accent-color: #d9b56a; width: 15px; height: 15px; }

.btn-print {
  background: #d9b56a;
  color: #1a1412;
  border: 0;
  border-radius: 999px;
  padding: 9px 20px;
  font: inherit;
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
}

.btn-print:hover { background: #e8cb8a; }

.hint {
  position: fixed;
  inset: auto 0 0 0;
  z-index: 10;
  padding: 10px 16px;
  text-align: center;
  font-size: 12.5px;
  color: #a89b8a;
  background: rgba(26, 20, 18, 0.92);
  border-top: 1px solid rgba(217, 181, 106, 0.16);
}

.hint code { font-family: inherit; color: #d9b56a; }

@media (max-width: 860px) {
  .tb-title { display: none; }
}

/* ── L'impression ──────────────────────────────────────────────────── */
@page { size: A4; margin: 0; }

@media print {
  body { background: none; padding: 0; }
  .toolbar, .hint { display: none !important; }
  .sheet { margin: 0; box-shadow: none; outline: none; break-after: avoid; }
}
</style>
</head>
<body>

<div class="toolbar" role="toolbar" aria-label="Options d'impression">
  <span class="tb-title">Les équipes · aperçu</span>
  <div class="seg" role="group" aria-label="Version">
    <button type="button" data-theme-choice="ivoire" aria-pressed="true">Ivoire</button>
    <button type="button" data-theme-choice="velours" aria-pressed="false">Velours</button>
  </div>
  <label><input type="checkbox" id="chk-groupes"> Afficher les groupes</label>
  <button type="button" class="btn-print" id="btn-print">Imprimer</button>
</div>

<main class="sheet" id="sheet" aria-live="polite"></main>

<div class="hint">Pour changer les équipes : ouvre ce fichier avec le Bloc-notes, la liste est tout en haut. <code>Imprimer</code> sort la feuille en A4, sans marges.</div>

<script>
(function () {
  'use strict'

  var STAR = '<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.85 6.1 6.65.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.65-.8z" fill="currentColor"/></svg>'

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
    })
  }

  /* Lit la liste en texte libre : une ligne « Équipe N — Nom » puis une
     personne par ligne, « Prénom + sa copine ⭐ — groupe ». */
  function parseTeams(raw) {
    var teams = []
    raw.split('\n').forEach(function (line) {
      line = line.trim()
      if (!line || line.charAt(0) === '#') return

      var head = line.match(/^[ée]quipe\s*(\d+)\s*(?:[—–-]+\s*(.*))?$/i)
      if (head) {
        var name = (head[2] || '').trim()
        if (/^\d+\s*(personnes?|invit[ée]s?|joueurs?|pers\.?)$/i.test(name)) name = ''
        teams.push({ num: head[1], name: name, members: [] })
        return
      }
      if (!teams.length) return

      var split = line.match(/^(.*?)\s*(?:[—–]|\s-\s)\s*(.*)$/)
      var who = split ? split[1] : line
      var group = split ? split[2].trim() : ''
      var captain = false
      if (/[⭐★]/.test(who)) { captain = true; who = who.replace(/[⭐★]/g, '').trim() }
      if (/[⭐★]/.test(group)) { captain = true; group = group.replace(/[⭐★]/g, '').trim() }

      var parts = who.split(/\s\+\s/)
      teams[teams.length - 1].members.push({
        name: parts[0].trim(),
        plus: parts.slice(1).join(' + ').trim(),
        captain: captain,
        group: group.toLowerCase(),
      })
    })
    return teams
  }

  function headcount(team) {
    return team.members.reduce(function (n, m) { return n + 1 + (m.plus ? 1 : 0) }, 0)
  }

  function splitEmoji(name) {
    var m = name.match(/\s*(\p{Extended_Pictographic}[\p{Extended_Pictographic}\uFE0F\u200D]*)$/u)
    if (!m) return { text: name, emoji: '' }
    return { text: name.slice(0, m.index).trim(), emoji: m[1] }
  }

  function renderTeam(team) {
    var count = headcount(team)
    var people = count + ' invité' + (count > 1 ? 's' : '')
    var named = splitEmoji(team.name)
    var title = named.text ? esc(named.text) : 'Équipe ' + esc(team.num)
    var meta = named.text ? 'Équipe ' + esc(team.num) + ' · ' + people : people
    var emoji = named.emoji ? '<span class="emoji">' + esc(named.emoji) + '</span>' : ''

    var rows = team.members.map(function (m) {
      return '<li class="member">' +
        '<span class="name">' + esc(m.name) + '</span>' +
        (m.plus ? '<span class="plus">+ ' + esc(m.plus) + '</span>' : '') +
        (m.captain ? STAR : '') +
        (m.group ? '<span class="group">' + esc(m.group) + '</span>' : '') +
        '</li>'
    }).join('')

    return '<section class="card">' +
      '<div class="card-head">' +
        '<div class="num">' + esc(team.num) + '</div>' +
        '<div><h2 class="card-title">' + title + emoji + '</h2><div class="card-meta">' + meta + '</div></div>' +
      '</div>' +
      '<ul class="members">' + rows + '</ul>' +
    '</section>'
  }

  function render() {
    var teams = parseTeams(document.getElementById('equipes').textContent)
    var lines = document.getElementById('titre').textContent.split('\n')
      .map(function (l) { return l.trim() }).filter(Boolean)
    var total = teams.reduce(function (n, t) { return n + headcount(t) }, 0)

    document.getElementById('sheet').innerHTML =
      '<header class="head">' +
        '<div class="eyebrow">' + esc(lines[0] || '') + '</div>' +
        '<h1 class="title">' + esc(lines[1] || '') + '</h1>' +
        '<div class="subtitle">' + esc(lines[2] || '') + '</div>' +
      '</header>' +
      '<div class="filet"></div>' +
      '<div class="grid">' + teams.map(renderTeam).join('') + '</div>' +
      '<footer class="foot">' +
        '<span class="legend">' + STAR + ' capitaine</span>' +
        '<span>' + teams.length + ' équipes · ' + total + ' invités</span>' +
      '</footer>'
  }

  /* Les choix vivent dans l'URL (#velours+groupes) : un lien suffit à
     rouvrir la feuille dans la bonne version. */
  function flags() {
    return location.hash.replace(/^#/, '').split(/[+,]/).filter(Boolean)
  }

  function setFlags(theme, groupes) {
    var next = []
    if (theme === 'velours') next.push('velours')
    if (groupes) next.push('groupes')
    var hash = next.length ? '#' + next.join('+') : ''
    if (hash !== location.hash) {
      history.replaceState(null, '', location.pathname + location.search + hash)
    }
    apply()
  }

  function apply() {
    var f = flags()
    var theme = f.indexOf('velours') >= 0 ? 'velours' : 'ivoire'
    var groupes = f.indexOf('groupes') >= 0
    document.documentElement.dataset.theme = theme
    document.documentElement.dataset.groupes = groupes ? 'oui' : 'non'
    Array.prototype.forEach.call(document.querySelectorAll('[data-theme-choice]'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.themeChoice === theme))
    })
    document.getElementById('chk-groupes').checked = groupes
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-theme-choice]'), function (b) {
    b.addEventListener('click', function () {
      setFlags(b.dataset.themeChoice, document.getElementById('chk-groupes').checked)
    })
  })
  document.getElementById('chk-groupes').addEventListener('change', function (e) {
    setFlags(document.documentElement.dataset.theme, e.target.checked)
  })
  document.getElementById('btn-print').addEventListener('click', function () { window.print() })
  window.addEventListener('hashchange', apply)

  render()
  apply()
})()
</script>
</body>
</html>
