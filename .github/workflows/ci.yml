# Le filet du dépôt : rien ne rejoint `main` sans que le typecheck, les tests,
# le build et le test de bout en bout soient passés.
#
# `npm run smoke` boote un vrai serveur sur une base jetable et rejoue une
# soirée entière — comptes, quiz, réponses, scoring, équipes, archives,
# profils. `npm test` lance les tests ciblés de `server/test/` : chacun sur son
# propre serveur jetable, pour les pannes, les courses et les messages
# malformés qu'une soirée rejouée d'un bout à l'autre ne provoque jamais.
name: Vérification

on:
  push:
    branches: [main]
  pull_request:
  # Relance à la main depuis l'onglet Actions. Sans ça, une proposition de
  # modification dont l'exécution a été manquée — un `push --force` passé
  # juste avant sa création, par exemple — ne peut plus jamais être vérifiée
  # autrement qu'en la refermant et la rouvrant.
  workflow_dispatch:

# Une PR qui reçoit trois poussées d'affilée n'a pas besoin de trois exécutions :
# seule la dernière dit quelque chose.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` ici, et non `install` : en intégration, on veut exactement ce que
      # le fichier de verrouillage décrit, et rien d'autre.
      - run: npm ci --no-audit --no-fund

      - name: Typecheck (serveur + client)
        run: npm run check

      # Les tests ciblés : un serveur jetable par fichier, lancés en parallèle.
      # Ils passent avant le smoke parce qu'ils disent plus vite, et plus
      # précisément, ce qui a cassé.
      - name: Tests (server/test)
        run: npm test

      - name: Build du client
        run: npm run build

      # Le test de bout en bout se fabrique sa propre base dans un dossier
      # temporaire : aucun service à démarrer, aucun secret à fournir.
      - name: Test de bout en bout
        run: npm run smoke
