# Le filet du dépôt : rien ne rejoint `main` sans que le typecheck, les tests,
# le build et le test de bout en bout soient passés.
#
# `npm run smoke` boote un vrai serveur sur une base jetable et rejoue une
# soirée entière — comptes, quiz, réponses, scoring, équipes, archives,
# profils. `npm test` lance les tests ciblés de `server/test/` : chacun sur son
# propre serveur jetable, pour les pannes, les courses et les messages
# malformés qu'une soirée rejouée d'un bout à l'autre ne provoque jamais.
#
# Tout ne tient plus sur une machine : le 1er novembre 2026, une seule
# exécution prenait 14 min 46, dont 12 min 20 de tests. Les tests se répartissent
# donc sur quatre machines à la fois, chaque fichier dans une tranche et une
# seule (`scripts/tests.mjs --tranche`), pendant qu'une cinquième fait le
# typecheck, le build et le smoke. Le dépôt est public : ces machines ne
# coûtent rien.
name: Vérification

on:
  push:
    branches: [main]
  pull_request:
  # Relance à la main depuis l'onglet Actions. Sans ça, une proposition de
  # modification dont l'exécution a été manquée — un `push --force` passé
  # juste avant sa création, par exemple — ne peut plus jamais être vérifiée
  # autrement qu'en la refermant et la rouvrant.
  workflow_dispatch:

# Une PR qui reçoit trois poussées d'affilée n'a pas besoin de trois exécutions :
# seule la dernière dit quelque chose.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Les tests ciblés : un serveur jetable par fichier, huit fichiers à la fois
  # par machine. Une tranche qui échoue n'arrête pas les autres : chacune dit
  # ses échecs.
  tests:
    name: tests ${{ matrix.tranche }}/4
    runs-on: ubuntu-latest
    # Un filet contre l'exécution qui pend : une tranche prend deux à trois minutes.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tranche: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` ici, et non `install` : en intégration, on veut exactement ce que
      # le fichier de verrouillage décrit, et rien d'autre.
      - run: npm ci --no-audit --no-fund

      - name: Tests (server/test), tranche ${{ matrix.tranche }} sur 4
        working-directory: server
        run: node scripts/tests.mjs --tranche=${{ matrix.tranche }}/4

  bout-en-bout:
    name: typecheck, build et smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck (serveur + client)
        run: npm run check

      - name: Build du client
        run: npm run build

      # Le test de bout en bout se fabrique sa propre base dans un dossier
      # temporaire : aucun service à démarrer, aucun secret à fournir.
      - name: Test de bout en bout
        run: npm run smoke

  # La vérification d'avant s'appelait `verifier` : elle garde son nom, et ne
  # passe que si tout le reste est passé. `always()` la fait juger même quand
  # une tranche échoue ou est annulée — sans lui, elle serait sautée, et une
  # vérification sautée passe pour réussie aux yeux de GitHub.
  verifier:
    needs: [tests, bout-en-bout]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Les tests et le bout en bout, tous passés
        run: |
          echo "tests : ${{ needs.tests.result }} · typecheck, build et smoke : ${{ needs.bout-en-bout.result }}"
          test "${{ needs.tests.result }}" = success
          test "${{ needs.bout-en-bout.result }}" = success
