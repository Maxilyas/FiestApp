# Déploiement sur Render (offre gratuite). Le dépôt étant connecté, Render lit
# ce fichier et crée le service ; les valeurs marquées `sync: false` se
# saisissent dans l'interface (elles ne doivent pas vivre dans le dépôt).
services:
  - type: web
    name: quizz-romane-30
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start -w server
    # Sert aussi de cible au service de réveil : sans trafic, l'offre gratuite
    # endort l'application au bout de 15 minutes.
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Le compte administrateur, créé au tout premier démarrage seulement :
      # identifiant, mot de passe (à changer ensuite depuis « Mon compte »,
      # puis à retirer d'ici) et nom de l'espace dans les adresses.
      - key: ADMIN_LOGIN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SLUG
        sync: false
      # Bibliothèque de quiz : libsql://... (Turso) + son jeton.
      - key: QUIZ_DB_URL
        sync: false
      - key: QUIZ_DB_TOKEN
        sync: false
