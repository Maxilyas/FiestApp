# Déploiement sur Render. Le dépôt étant connecté, Render lit ce fichier et
# crée les services ; les valeurs marquées `sync: false` se saisissent dans
# l'interface (elles ne doivent pas vivre dans le dépôt).
#
# ⚠️ CE FICHIER NE PILOTE QUE LES SERVICES QU'UN BLUEPRINT A CRÉÉS. Render
# n'adopte pas un service existant : créer un second blueprint fabrique des
# COPIES, avec un suffixe au hasard (`fiestapp-quizz-ljwa`), pendant que les
# vraies dorment à côté. Et une copie n'est pas au même endroit : l'adresse
# `onrender.com` d'un service se fixe à sa création — le renommer ne la change
# pas, le recréer si. Tant qu'un QR est imprimé ou qu'un lien circule, on
# garde le service qui y répond. Les nôtres ont été créés à la main : ce
# fichier reste la référence de ce qu'ils doivent contenir, et c'est leur
# tableau de bord qui fait foi. Voir MISE-EN-LIGNE.md, étape 7.
#
# ── Deux services, deux mondes ───────────────────────────────────────────
#
# Tout ce qui est précieux vit dans Turso ; la base locale est jetable et se
# reconstruit du miroir. La séparation entre préprod et prod tient donc à une
# seule chose : `QUIZ_DB_URL`. Le code, lui, est identique.
#
# RÈGLE ABSOLUE : jamais la même base Turso pour les deux. Un « C'était un
# essai », une soirée retirée de l'historique ou une suppression de compte en
# préprod effacerait de vraies soirées archivées : ce sont les seuls gestes
# sans retour de l'application.
#
# La prod ne se déploie PAS toute seule (`autoDeploy: false`). Le mode de
# panne de cette application est « la soirée est gâchée » : on regarde la
# préprod tourner, puis on promeut à la main, la veille d'une soirée.
#
# ── Les deux commandes ───────────────────────────────────────────────────
#
# `npm ci`, et non `npm install` : l'intégration continue installe déjà
# exactement ce que décrit package-lock.json ; la production doit tourner sur
# ces mêmes versions, pas sur celles du jour du déploiement.
#
# `exec node …` plutôt que `npm start` : npm ne transmettait pas le signal
# d'arrêt. Le SIGTERM de l'hébergeur se perdait en route, et l'arrêt propre —
# celui qui vide le miroir de la partie en cours dans Turso — ne s'exécutait
# jamais. `exec` remplace le shell par Node, qui reçoit le signal lui-même ;
# sans npm ni tsx en surplomb, c'est aussi 45 Mo de mémoire en moins sur les
# 512 de l'offre gratuite.
#
# ⚠️ Si les services ont été créés à la main (voir MISE-EN-LIGNE.md, étape 7),
# ce fichier ne les pilote pas : ces deux commandes se recopient dans le
# tableau de bord de chacun (Settings, rubrique Build pour la première,
# rubrique Deploy pour la seconde). Préprod d'abord — un déploiement, un
# réveil, une partie — et la prod seulement ensuite.
services:
  # ── PRODUCTION ─────────────────────────────────────────────────────────
  #
  # L'adresse publique s'est fixée à la création du service, et le renommer
  # ne la change pas. Le recréer, si : les QR codes imprimés et les liens
  # déjà partagés ne mèneraient plus nulle part.
  - type: web
    name: fiestapp-quizz
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # On promeut à la main depuis le tableau de bord, quand on a vu la
    # préprod tourner. C'est un clic contre une soirée ratée.
    autoDeploy: false
    buildCommand: npm ci && npm run build
    startCommand: cd server && exec node --import tsx src/index.ts
    # Render s'en sert pour savoir si le service répond. L'offre gratuite
    # endort l'application après 15 minutes sans trafic, et on l'assume : on
    # ouvre l'écran commun cinq minutes avant l'arrivée des invités, et le
    # trafic des websockets la tient éveillée tout le reste de la soirée.
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '22'
      # MAX_PLAYERS plafonne les invités d'une soirée, par-dessus le réglage
      # de chaque espace. Sur l'offre gratuite, 150 : une salle de 300 fait
      # céder le dixième de processeur (mesuré), et le code, sans elle, laisse
      # monter jusqu'à 500. Il borne chaque espace, pas leur somme. C'est le
      # tableau de bord qui fait foi : le journal de démarrage (« au plus …
      # invités par soirée ») et /healthz (`maxPlayers`) disent la valeur lue.
      - key: MAX_PLAYERS
        value: '150'
      # Le compte administrateur, créé au tout premier démarrage seulement :
      # identifiant, mot de passe d'amorçage (à changer ensuite depuis
      # « Mon compte », puis à retirer d'ici : une fois le compte créé, le
      # serveur redémarre très bien sans) et nom de l'espace dans les
      # adresses (les invités ouvrent https://…/<ADMIN_SLUG>).
      - key: ADMIN_LOGIN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SLUG
        sync: false
      # Bibliothèque de quiz, comptes, archives et profils : la base Turso
      # DE PRODUCTION. Celle qu'on ne perd pas — et qu'on sauvegarde
      # (`npm run sauvegarde`). Sans elle, le serveur refuse de démarrer :
      # le disque de l'offre gratuite s'efface à chaque réveil.
      - key: QUIZ_DB_URL
        sync: false
      - key: QUIZ_DB_TOKEN
        sync: false

  # ── PRÉPRODUCTION ──────────────────────────────────────────────────────
  #
  # Ce que le développement local ne peut pas éprouver : le miroir Turso avec
  # sa vraie latence, le disque effacé au redémarrage, le réveil après veille,
  # les cookies `Secure`, l'adresse du client derrière le proxy, la politique
  # de sécurité du contenu en conditions réelles.
  #
  # Elle dort quand personne ne s'en sert, comme la production : les 750 heures
  # mensuelles de l'offre gratuite ne suffiraient pas à garder deux services
  # éveillés en permanence. On la réveille en ouvrant son adresse.
  - type: web
    name: fiestapp-quizz-preprod
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # Elle, oui : chaque fusion sur `main` part en préprod.
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: cd server && exec node --import tsx src/index.ts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Le bandeau « PRÉPROD » s'affiche alors sur toutes les pages : on ne
      # projette pas la mauvaise instance un soir de quiz, et on n'écrit pas
      # ses quiz dans la mauvaise base.
      - key: APP_ENV
        value: preprod
      # Le même plafond que la production : c'est sur elle qu'on mesure.
      - key: MAX_PLAYERS
        value: '150'
      - key: ADMIN_LOGIN
        sync: false
      # Un mot de passe DIFFÉRENT de celui de la production.
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SLUG
        sync: false
      # La base Turso de préproduction — jamais celle de la prod.
      - key: QUIZ_DB_URL
        sync: false
      - key: QUIZ_DB_TOKEN
        sync: false
