<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Le zoom reste permis : qui voit mal doit pouvoir agrandir. Le double-tap
         qui zoomait par accident est neutralisé par `touch-action` dans le CSS. -->
    <!-- `interactive-widget` : sur Chrome Android, la page se loge au-dessus
         du clavier au lieu de passer dessous — le bouton d'un écran d'entrée
         ne s'y cache plus. Les autres navigateurs l'ignorent ; `clavier.ts`
         fait le reste. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Teinte la barre du navigateur : le téléphone ne montre plus un bandeau
         blanc au-dessus d'un fond sombre. Valeur relevée sur le haut du halo
         réel de l'application. -->
    <meta name="theme-color" content="#261d18" />
    <!-- « Ajouter à l'écran d'accueil » ouvre alors l'application sans barre
         d'adresse, comme une vraie application. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icone.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icone.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Quizz" />
    <!-- Une seule police part avec le script : celle du nom de la soirée, que
         l'attente d'un invité écrit en grand avant tout le reste (le serveur
         le glisse dans la page). Sans elle, ce nom s'affichait 650 ms dans une
         police de repli, puis sautait. Figtree, elle, ne part plus en tête :
         préchargée, elle prenait au script la bande passante d'une 4G, et
         l'écran d'entrée arrivait plus tard (mesuré : 2 026 ms avec les deux,
         1 991 avec Cormorant seul) ; demandée par la feuille de style, elle
         est là bien avant lui. Pas de `modulepreload` des morceaux de la
         route non plus : mesuré, c'est pire — le goulot est la bande
         passante, pas la cascade. `crossorigin` est exigé par les navigateurs
         pour précharger une police, même chez soi. -->
    <link rel="preload" href="/fonts/cormorant-garamond-600.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Chaque page pose ensuite le titre de sa soirée. -->
    <title>FiestApp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
