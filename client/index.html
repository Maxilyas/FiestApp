<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Le zoom reste permis : qui voit mal doit pouvoir agrandir. Le double-tap
         qui zoomait par accident est neutralisé par `touch-action` dans le CSS. -->
    <!-- `interactive-widget` : sur Chrome Android, la page se loge au-dessus
         du clavier au lieu de passer dessous — le bouton d'un écran d'entrée
         ne s'y cache plus. Les autres navigateurs l'ignorent ; `clavier.ts`
         fait le reste. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Teinte la barre du navigateur : le téléphone ne montre plus un bandeau
         blanc au-dessus d'un fond sombre. Valeur relevée sur le haut du halo
         réel de l'application. -->
    <meta name="theme-color" content="#261d18" />
    <!-- « Ajouter à l'écran d'accueil » ouvre alors l'application sans barre
         d'adresse, comme une vraie application. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Le SVG pour les navigateurs qui le lisent, `favicon.ico` pour les
         autres ; iOS ignore une icône SVG : la sienne est un PNG, sur fond
         plein (il arrondit les coins lui-même). -->
    <link rel="icon" href="/icone.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/icone-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Quizz" />
    <!-- Les deux polices partent en même temps que le script, pas après la
         feuille de style : le premier écran arrive habillé. `crossorigin` est
         exigé par les navigateurs pour précharger une police, même chez soi. -->
    <link rel="preload" href="/fonts/cormorant-garamond-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/figtree-variable.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Le serveur y pose le titre de l'espace et les balises d'aperçu
         (`server/src/core/apercus.ts`) ; chaque page pose ensuite le sien. -->
    <title>FiestApp</title>
  </head>
  <body>
    <!-- Pas de repère sur la racine : chaque page pose le sien (main.tsx). -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
